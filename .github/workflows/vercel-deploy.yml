name: Deploy no vercel

env: 
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


on: 
  push: 
    branches:
      - imsi-action
  jobs:
    Deploy-Production:
      runs-on: ubuntu-latest
    steps:
        - name: Checkout
        use: actions/checkout@v4

        - name: Setup Node
        use: action/setup/node@v4
        with: 
          node-version: '18'

        - name: install Vercel CLI
        run: npm install -g vercel@latest

        - name: Pull Vercel Environment
        run: vercel pull --yes --envoronment=production --token=${{ secrets.VERCEL_TOKEN}}

        - name: Build Artifacts
        run: vercel build --prod --teken=${{ secrets.VERCEL_TOKEN }}

        - name: Deploy
        run: vercel deploy --prodbuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        

